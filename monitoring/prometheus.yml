global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: coupon-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - app1:8080
          - app2:8080
          - app3:8080

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
